<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E48B4" />
      <stop offset="50%" stop-color="#0B3795" />
      <stop offset="100%" stop-color="#06256C" />
    </linearGradient>
  </defs>

  <!-- Deep Royal Blue Squircle Body -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#logo-blue-grad)" />

  <!-- Room Interior Frame & Wall Screen -->
  <rect x="29" y="26" width="43" height="38" fill="none" stroke="#FFFFFF" stroke-width="3" rx="1.5" />
  
  <!-- Presentation Screen / Whiteboard -->
  <rect x="41" y="35" width="23" height="12" fill="none" stroke="#FFFFFF" stroke-width="2.2" rx="0.8" />
  <line x1="39" y1="47" x2="66" y2="47" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

  <!-- 3 Seated Audience Members -->
  <!-- Person 1 -->
  <circle cx="43.5" cy="51.5" r="2.8" fill="#FFFFFF" />
  <path d="M 39.5 59 C 39.5 55.5 47.5 55.5 47.5 59 Z" fill="#FFFFFF" />

  <!-- Person 2 (Center) -->
  <circle cx="52" cy="51.5" r="2.8" fill="#FFFFFF" />
  <path d="M 48 59 C 48 55.5 56 55.5 56 59 Z" fill="#FFFFFF" />

  <!-- Person 3 -->
  <circle cx="60.5" cy="51.5" r="2.8" fill="#FFFFFF" />
  <path d="M 56.5 59 C 56.5 55.5 64.5 55.5 64.5 59 Z" fill="#FFFFFF" />

  <!-- Desk Line -->
  <rect x="39" y="59.5" width="25" height="5" fill="#FFFFFF" rx="0.5" />

  <!-- Open Door leaf swung open towards left -->
  <path d="M 19 24.5 L 36 32 V 75.5 L 19 68 Z" fill="#FFFFFF" />
  <!-- Doorknob -->
  <circle cx="32" cy="50" r="2.2" fill="#0B3795" />

  <!-- Calendar Card Badge (Bottom-Right) -->
  <rect x="61" y="53" width="23" height="20" rx="3.5" fill="#FFFFFF" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))" />
  
  <!-- Top Calendar Loops / Spiral Rings -->
  <rect x="65.5" y="50" width="2.5" height="5" rx="1.25" fill="#FFFFFF" stroke="#0B3795" stroke-width="1.2" />
  <rect x="76" y="50" width="2.5" height="5" rx="1.25" fill="#FFFFFF" stroke="#0B3795" stroke-width="1.2" />

  <!-- Calendar Day Grid -->
  <!-- Row 1 -->
  <rect x="64.5" y="58.5" width="4.5" height="4.5" rx="0.8" fill="#0B3795" />
  <rect x="70.5" y="58.5" width="4.5" height="4.5" rx="0.8" fill="#0B3795" />
  <rect x="76.5" y="58.5" width="4.5" height="4.5" rx="0.8" fill="#0B3795" />

  <!-- Row 2 -->
  <rect x="64.5" y="64.5" width="4.5" height="4.5" rx="0.8" fill="#0B3795" />
  <!-- Golden Amber Highlighted Day! -->
  <rect x="70.5" y="64.5" width="4.5" height="4.5" rx="0.8" fill="#F59E0B" />
  <rect x="76.5" y="64.5" width="4.5" height="4.5" rx="0.8" fill="#0B3795" />

  <!-- Radiant Golden Energy Sparks -->
  <path d="M 78 48 L 81 42" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 82 51 L 87 46" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
</svg>

